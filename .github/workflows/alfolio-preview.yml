name: Test actual al-folio theme (no deployment)
on:
  push:
    branches: [chatgpt-alfolio-preview-2026]
    paths:
      - 'alfolio-preview/**'
      - '.github/workflows/alfolio-preview.yml'
  workflow_dispatch:

concurrency:
  group: alfolio-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Fetch official al-folio source
        run: |
          git clone --depth 1 --branch main https://github.com/alshedivat/al-folio.git alfolio-src
          python3 alfolio-preview/configure.py
      - name: Setup Ruby and upstream Gemfile
        uses: ruby/setup-ruby@v1
        with:
          working-directory: alfolio-src
          ruby-version: '3.3.5'
          bundler-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify image processing dependencies
        run: |
          if ! command -v convert >/dev/null && ! command -v magick >/dev/null; then
            echo "ImageMagick is missing on runner"; exit 1
          fi
      - name: Build with the official Jekyll theme and scholar
        working-directory: alfolio-src
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
      - name: Render desktop and mobile screenshots
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          python3 -m http.server 4000 --directory alfolio-src/_site > /tmp/alfolio-http.log 2>&1 &
          sleep 4
          node alfolio-preview/screenshot.cjs
      - name: Upload screenshots and the real Jekyll output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alfolio-real-render
          path: |
            alfolio-preview/screenshots/
            alfolio-src/_site/
          retention-days: 7
